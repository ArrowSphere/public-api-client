name: Release
run-name: Release (${{ inputs.bump }})

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Which part of the version to increment
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  release:
    name: Publish a new release
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Compute the new version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          LATEST=$(git tag --list '[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)
          IFS=. read -r MAJOR MINOR PATCH <<< "${LATEST:-0.0.0}"
          case "$BUMP" in
            major) VERSION="$((MAJOR + 1)).0.0" ;;
            minor) VERSION="$MAJOR.$((MINOR + 1)).0" ;;
            patch) VERSION="$MAJOR.$MINOR.$((PATCH + 1))" ;;
          esac
          echo "Releasing $VERSION (previous version: $LATEST)" >> "$GITHUB_STEP_SUMMARY"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create release branch
        run: git checkout -b release/${{ steps.version.outputs.version }}

      - name: Update changelog
        uses: thomaseizinger/keep-a-changelog-new-release@3.1.0
        with:
          tag: ${{ steps.version.outputs.version }}

      # In order to make a commit, we need to initialize a user.
      # You may choose to write something less generic here if you want, it doesn't matter functionality wise.
      - name: Initialize mandatory git config
        run: |
          git config user.name "GitHub actions"
          git config user.email noreply@github.com

      - name: Commit changelog
        id: make-commit
        run: |
          curl -fsSL https://dprint.dev/install.sh | sh
          /home/runner/.dprint/bin/dprint -c .github/workflows/.dprintrc.json fmt CHANGELOG.md
          git add CHANGELOG.md
          git commit --message "Release ${{ steps.version.outputs.version }}"
          echo "LAST_COMMIT=$(git rev-parse HEAD)" >> $GITHUB_ENV

      - name: Push new branch
        run: git push origin release/${{ steps.version.outputs.version }}

      - name: Create pull request
        env:
          GH_TOKEN: ${{ secrets.REPO_SCOPED_TOKEN }}
        run: |
          gh pr create \
            --head release/${{ steps.version.outputs.version }} \
            --base master \
            --title "Release version ${{ steps.version.outputs.version }}" \
            --body "Automatic pull request for release version ${{ steps.version.outputs.version }}"
          gh pr merge release/${{ steps.version.outputs.version }} --auto --rebase
