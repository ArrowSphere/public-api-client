name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: The version you want to release
        required: true

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  release:
    name: Publish a new release
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v7

      - name: Create release branch
        run: git checkout -b release/${{ github.event.inputs.version }}

      - name: Update changelog
        uses: thomaseizinger/keep-a-changelog-new-release@3.1.0
        with:
          tag: ${{ github.event.inputs.version }}

      # In order to make a commit, we need to initialize a user.
      # You may choose to write something less generic here if you want, it doesn't matter functionality wise.
      - name: Initialize mandatory git config
        run: |
          git config user.name "GitHub actions"
          git config user.email noreply@github.com

      - name: Commit changelog
        id: make-commit
        run: |
          curl -fsSL https://dprint.dev/install.sh | sh
          /home/runner/.dprint/bin/dprint -c .github/workflows/.dprintrc.json fmt CHANGELOG.md
          git add CHANGELOG.md
          git commit --message "Release ${{ github.event.inputs.version }}"
          echo "LAST_COMMIT=$(git rev-parse HEAD)" >> $GITHUB_ENV

      - name: Push new branch
        run: git push origin release/${{ github.event.inputs.version }}

      - name: Create pull request
        env:
          GH_TOKEN: ${{ secrets.REPO_SCOPED_TOKEN }}
        run: |
          gh pr create \
            --head release/${{ github.event.inputs.version }} \
            --base master \
            --title "Release version ${{ github.event.inputs.version }}" \
            --body "Automatic pull request for release version ${{ github.event.inputs.version }}"
          gh pr merge release/${{ github.event.inputs.version }} --auto --rebase
